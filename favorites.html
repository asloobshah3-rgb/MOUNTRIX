<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Keep your favorite mountain destinations together in your personal Mountrix list."
    />
    <title>Your Favorite Mountains | Mountrix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body data-page="favorites">
    <header class="navbar"></header>
    <p class="site-status" id="siteStatus" role="status" aria-live="polite"></p>
    <main>
      <section class="page-hero favorites-hero">
        <div class="reveal">
          <p class="eyebrow">YOUR PERSONAL FIELD NOTES</p>
          <h1>Mountains to<br /><span>remember.</span></h1>
          <p>Keep the peaks that caught your imagination close at hand.</p>
        </div>
      </section>
      <section class="section favorites-section">
        <div class="section-heading reveal">
          <div>
            <p class="eyebrow">SAVED ON THIS DEVICE</p>
            <h2>Your favorites.</h2>
          </div>
        </div>
        <div
          class="destination-grid explorer-grid"
          id="favoriteResults"
          aria-live="polite"
        >
          <p class="loading-note">Loading your saved mountains…</p>
        </div>
      </section>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
